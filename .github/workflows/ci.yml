name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# CI pins the Go release below (Renovate moves it). 1.27.3 fails govulncheck (GO-2026-6859, net/http). The go.mod floor is 1.27.1.
jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.27.4'
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"; echo "$unformatted"
            exit 1
          fi

  # The bomb tests run under a memory limit: a worker that builds what a hostile
  # file claims is killed by it instead of passing.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      GOMEMLIMIT: 1GiB
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.27.4'
      - run: go version
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...

  # The worker module itself: GOOS=js GOARCH=wasm, with its size reported.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.27.4'
      - run: GOOS=js GOARCH=wasm go vet ./cmd/avkit-worker
      - run: GOOS=js GOARCH=wasm go build -trimpath -ldflags="-s -w" -o avkit-worker.wasm ./cmd/avkit-worker
      - name: size
        run: |
          gzip -9 -c avkit-worker.wasm > avkit-worker.wasm.gz
          ls -l avkit-worker.wasm avkit-worker.wasm.gz

  # A header and a file are untrusted. The corpus in testdata/fuzz runs as
  # ordinary tests above; this job also mutates it for a while.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.27.4'
      - run: go test -fuzz FuzzDecodeRequest -fuzztime 30s ./proto
      - run: go test -fuzz FuzzClampOnlyLowers -fuzztime 20s ./proto
      - run: go test -fuzz FuzzHandle -fuzztime 60s ./serve

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.27.4'
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
      - run: GOOS=js GOARCH=wasm govulncheck ./cmd/avkit-worker

  # The one 32-bit target, where int is 32 bits wide: a length converted to int
  # before it is compared wraps only here.
  arch-386:
    name: arch 386
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.27.4'
      - run: GOARCH=386 go vet ./...
      - run: GOARCH=386 go test ./...
